<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg1" cx="25%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111840"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </radialGradient>
    <radialGradient id="bg2" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a0840"/>
      <stop offset="100%" stop-color="#070C1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#6A00F4"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072FF"/>
      <stop offset="100%" stop-color="#6A00F4"/>
    </linearGradient>
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FF8800" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF8800" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="60%">
      <stop offset="0%"  stop-color="#FFF8DC"/>
      <stop offset="26%" stop-color="#FFCA28"/>
      <stop offset="52%" stop-color="#FFA000"/>
      <stop offset="54%" stop-color="#7C4400"/>
      <stop offset="57%" stop-color="#FFD700"/>
      <stop offset="76%" stop-color="#FFE566"/>
      <stop offset="90%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#7C4400"/>
    </radialGradient>
    <radialGradient id="coinShine" cx="35%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="coinClip">
      <circle cx="870" cy="315" r="188"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04" stroke="#6A8FFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left vertical accent bar -->
  <rect x="60" y="80" width="5" height="470" rx="3" fill="url(#accentV)"/>

  <!-- EQ bars (decorative, behind coin) -->
  <g opacity="0.18">
    <rect x="640" y="430" width="18" height="90" rx="4" fill="url(#accent)"/>
    <rect x="666" y="390" width="18" height="130" rx="4" fill="url(#accent)"/>
    <rect x="692" y="410" width="18" height="110" rx="4" fill="url(#accent)"/>
    <rect x="718" y="360" width="18" height="160" rx="4" fill="url(#accent)"/>
    <rect x="744" y="400" width="18" height="120" rx="4" fill="url(#accent)"/>
  </g>

  <!-- Coin glow halo -->
  <circle cx="870" cy="315" r="260" fill="url(#coinGlow)"/>

  <!-- Coin milled edge rings (outer to inner) -->
  <g opacity="0.55">
    <circle cx="870" cy="315" r="212" fill="none" stroke="#9A5C00" stroke-width="5"/>
    <circle cx="870" cy="315" r="205" fill="none" stroke="#FFE580" stroke-width="3"/>
    <circle cx="870" cy="315" r="199" fill="none" stroke="#9A5C00" stroke-width="3"/>
    <circle cx="870" cy="315" r="194" fill="none" stroke="#7C4400" stroke-width="2"/>
  </g>

  <!-- Coin outer rim -->
  <circle cx="870" cy="315" r="190" fill="#7C4400"/>
  <circle cx="870" cy="315" r="185" fill="#CC7700"/>
  <circle cx="870" cy="315" r="180" fill="#FFD700"/>

  <!-- Coin face -->
  <circle cx="870" cy="315" r="175" fill="url(#coinFace)" clip-path="url(#coinClip)"/>

  <!-- Coin shine overlay -->
  <circle cx="870" cy="315" r="175" fill="url(#coinShine)" clip-path="url(#coinClip)"/>

  <!-- Raised rim -->
  <circle cx="870" cy="315" r="160" fill="none" stroke="#7C4400" stroke-width="8" opacity="0.6"/>
  <circle cx="870" cy="315" r="155" fill="none" stroke="#FFE566" stroke-width="2" opacity="0.5"/>

  <!-- Lion emoji -->
  <text x="870" y="365" font-size="148" text-anchor="middle" dominant-baseline="auto" filter="url(#softglow)">🦁</text>

  <!-- "LIONCOIN" text on coin -->
  <path id="coinArc" d="M 710,315 A 160,160 0 0,1 1030,315" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="16" font-weight="900" fill="#7C4400" letter-spacing="6" opacity="0.7">
    <textPath href="#coinArc" startOffset="12%">LIONCOIN · OK MUSIC ·</textPath>
  </text>

  <!-- LEFT CONTENT -->

  <!-- Domain pill -->
  <rect x="86" y="88" width="220" height="34" rx="17" fill="#0072FF" fill-opacity="0.15" stroke="#0072FF" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="196" y="111" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#60A5FA" text-anchor="middle" letter-spacing="1">ok-music.net</text>

  <!-- Brand name -->
  <text x="86" y="235" font-family="'Arial Black', Impact, 'Arial Bold', sans-serif" font-size="148" font-weight="900" fill="#FFFFFF" letter-spacing="-4" filter="url(#glow)" opacity="0.97">OK</text>
  <text x="86" y="390" font-family="'Arial Black', Impact, 'Arial Bold', sans-serif" font-size="148" font-weight="900" fill="#FFFFFF" letter-spacing="-4" filter="url(#glow)" opacity="0.97">MUSIC</text>

  <!-- Gradient accent line under brand -->
  <rect x="86" y="405" width="440" height="5" rx="3" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="86" y="455" font-family="Arial, sans-serif" font-size="26" fill="#94A3B8" letter-spacing="0.5">Share AI Music · Connect · Earn LionCoins</text>

  <!-- Feature tags -->
  <g font-family="Arial, sans-serif" font-size="15" font-weight="600">
    <!-- Tag 1 -->
    <rect x="86" y="490" width="118" height="32" rx="16" fill="#0072FF" fill-opacity="0.2" stroke="#0072FF" stroke-width="1" stroke-opacity="0.6"/>
    <text x="145" y="511" fill="#60A5FA" text-anchor="middle"># AI Music</text>
    <!-- Tag 2 -->
    <rect x="216" y="490" width="128" height="32" rx="16" fill="#6A00F4" fill-opacity="0.2" stroke="#6A00F4" stroke-width="1" stroke-opacity="0.6"/>
    <text x="280" y="511" fill="#A78BFA" text-anchor="middle"># LionCoin</text>
    <!-- Tag 3 -->
    <rect x="356" y="490" width="138" height="32" rx="16" fill="#0072FF" fill-opacity="0.12" stroke="#0072FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="425" y="511" fill="#7DD3FC" text-anchor="middle"># Community</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#accent)" opacity="0.7"/>
</svg>
